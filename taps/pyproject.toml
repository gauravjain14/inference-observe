[project]
name = "io-taps"
version = "0.0.1"
description = "In-process taps that stream engine step data to the inference-observe collector"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.stat_logger_plugins"]
io_flow_tap = "io_taps.vllm_tap:FlowTap"

[project.entry-points."sglang.srt.plugins"]
io_flow_tap = "io_taps.sglang_tap:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["io_taps"]
